services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expensebot}
      POSTGRES_USER: ${POSTGRES_USER:-expensebot_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_USER: ${APP_DB_USER:-expensebot_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrations:
    image: ${DOCKER_REGISTRY-}expensebotapi
    build:
      context: .
      dockerfile: ExpenseBot.Api/Dockerfile
    command: ["--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-expensebot};Username=${POSTGRES_USER:-expensebot_admin};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set};Maximum Pool Size=5;Timeout=15;Command Timeout=60
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - database
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  expensebot.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-expensebot};Username=${APP_DB_USER:-expensebot_app};Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-20};Timeout=15;Command Timeout=30
      Database__ApplyMigrationsOnStartup: "false"
      Telegram__Token: ${TELEGRAM_TOKEN:?TELEGRAM_TOKEN must be set}
      Telegram__WebhookSecret: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.30.4-alpine
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "443:8443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/nginx:/etc/nginx/certs:ro
    depends_on:
      expensebot.api:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - edge
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
