user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time}';
    access_log /dev/stdout json_combined;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    limit_req_zone $binary_remote_addr zone=webhook_per_ip:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:1m;

    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 5s;
    client_body_timeout 10s;
    send_timeout 30s;
    server_tokens off;

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        location = /api/telegram/webhook {
            if ($request_method != POST) {
                return 404;
            }

            if ($http_content_type !~* "^application/json(?:\\s*;|$)") {
                return 404;
            }

            client_max_body_size 1m;
            limit_req zone=webhook_per_ip burst=20 nodelay;
            limit_req_status 429;
            limit_conn connections_per_ip 10;
            limit_conn_status 429;

            proxy_pass http://expensebot.api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location / {
            return 404;
        }
    }
}
