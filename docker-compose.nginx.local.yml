services:
  expensebot.api:
    environment:
      Telegram__WebhookSecret: ${TELEGRAM_WEBHOOK_SECRET:-local-dev-secret}

  nginx:
    image: nginx:1.30.4-alpine
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "${NGINX_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./docker/nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/nginx-local:/etc/nginx/certs:ro
    depends_on:
      expensebot.api:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - edge
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
