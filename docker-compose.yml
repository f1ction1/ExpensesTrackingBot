services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expensebot}
      POSTGRES_USER: ${POSTGRES_USER:-expensebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expensebot_dev}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expensebot} -d ${POSTGRES_DB:-expensebot}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - database

  expensebot.api:
    image: ${DOCKER_REGISTRY-}expensebotapi
    build:
      context: .
      dockerfile: ExpenseBot.Api/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-expensebot};Username=${POSTGRES_USER:-expensebot};Password=${POSTGRES_PASSWORD:-expensebot_dev};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:-20};Timeout=15;Command Timeout=30
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
      - database

volumes:
  postgres_data:

networks:
  edge:
  database:
